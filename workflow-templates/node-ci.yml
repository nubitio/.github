name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Override vars.CI_RUNNER_PROVIDER (blacksmith or github)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  node:
    uses: nubitio/.github/.github/workflows/reusable-ci-node.yml@main
    with:
      node-version: "22"
      package-manager: "pnpm"
      runner_provider: ${{ github.event.inputs.runner_provider || '' }}
