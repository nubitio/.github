name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Override vars.CI_RUNNER_PROVIDER (blacksmith or github)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  php:
    uses: nubitio/.github/.github/workflows/reusable-ci-php.yml@main
    with:
      php-version: "8.4"
      runner_provider: ${{ github.event.inputs.runner_provider || '' }}
